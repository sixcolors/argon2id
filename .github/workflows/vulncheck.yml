name: Govulncheck

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  vulncheck:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.26'
        cache: true

    - name: Install Govulncheck
      run: go install golang.org/x/vuln/cmd/govulncheck@latest

    - name: Run Govulncheck
      run: govulncheck ./...